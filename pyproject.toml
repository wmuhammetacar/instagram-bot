[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "instagram-bot"
version = "1.1.0"
description = "Profesyonel Instagram otomasyon sistemi: engajman, veri cekme, icerik paylasimi, zamanlayici ve web paneli"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["instagram", "bot", "automation", "engagement", "scheduler"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]

[project.scripts]
igbot = "bot:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.27", "ruff>=0.6"]  # httpx: FastAPI TestClient (test_api.py) icin

[tool.setuptools]
py-modules = ["bot"]
packages = ["insta_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle, I: import siralama, B: bugbear, UP: pyupgrade,
# C4: comprehension, SIM: sadelestirme
select = ["E", "F", "I", "B", "UP", "C4", "SIM"]
ignore = [
    "E501",    # satir uzunlugu (line-length ile yonetilir)
    "B008",    # FastAPI Depends/Header varsayilanlari cagri gerektirir
    "SIM105",  # contextlib.suppress zorunlu degil
    "SIM102",  # ic ice if okunabilirlik icin bilincli tercih
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731"]  # testlerde lambda atamalarina izin
